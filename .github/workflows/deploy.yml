name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  # 記事・スライド・コントリビューションを毎朝取り直して公開する（JST 6:00）
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Marp のデッキは Chrome で PDF 化する。変わっていないデッキは
      # scripts/decks/cache.mjs のフィンガープリントで再生成を飛ばせるので、
      # その成果物とキャッシュを持ち越す。
      - name: Restore built decks
        uses: actions/cache@v6
        with:
          path: |
            .cache
            public/decks
            public/pdfjs
          # 鍵を 2 段にする。前が出力を作るコード、後ろがデッキの中身。
          #
          # restore-keys は前方一致なので、コードのハッシュを接頭辞に置かないと
          # 意味がない — 厳密鍵を空振りさせても decks- で古いものが復元され、
          # 指紋（OUTPUT_CONFIG しか見ない）が「変わっていない」と言ってしまう。
          # 接頭辞に入れておけば、レンダリングを直した回は前の絵を拾えず、
          # OUTPUT_CONFIG.version を上げ忘れても作り直しになる。
          #
          # デッキを 1 本足しただけの回は接頭辞が同じなので、後ろの空振りを
          # restore-keys が受けて、変わっていないデッキはそのまま使える
          key: decks-${{ hashFiles('scripts/build-decks.mjs', 'scripts/decks/**') }}-${{ hashFiles('decks/**') }}
          restore-keys: decks-${{ hashFiles('scripts/build-decks.mjs', 'scripts/decks/**') }}-

      - name: Fetch content and build
        env:
          # contributions は GraphQL のため認証が必要。GH_PAT (public_repo / read:user)
          # が設定されていればそれを使い、無ければ GITHUB_TOKEN で試す。
          # 取得に失敗してもコミット済みの src/data/generated.json でビルドは通る。
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # ユーザーサイト (<user>.github.io) なのでルート配信
          BASE_PATH: /
        run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # 公開デッキはよそでホストされている PDF 1 本だけなので、Marp と「手元の PDF」の
  # 経路は本番ビルドで一度も通らない（表紙の生成・全文検索テキストの抽出も含めて）。
  # decks/_examples の見本を毎回ほんとうに焼いて、出力の中身まで確かめる。
  #
  # デッキのキャッシュは復元しない。ここは速さより「毎回描かせること」が目的。
  # DECKS_DIR で見本だけを指すので、よそへ PDF を取りに行かず、ネットワークの
  # 都合でデプロイが止まることもない。
  verify-decks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Marp の PDF 化に Chrome が要る。ubuntu-latest の image は
      # /usr/bin/google-chrome を持っていて scripts/decks/pdf.mjs の findChrome() が
      # 拾う。image から消えたら CHROME_PATH を渡す
      - run: npm run decks:examples

  deploy:
    needs: [build, verify-decks]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

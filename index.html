<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 題・説明・名前・テーマの鍵は src/data/profile.ts と src/lib/theme.ts が
         持ち、vite.config.ts が __…__ に入れる。ここに写すと 2 通りになる -->
    <title>__TITLE__</title>
    <meta name="description" content="__DESCRIPTION__" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="__SITE_URL__" />

    <!--
      ブラウザの外枠の色。global.css の --bg（light）と同値で、テーマを切り替えたら
      useTheme が実際の --bg を読んで書き換える。prefers-color-scheme の media で
      2 枚置く形は採らない — 手動トグルが OS の設定と食い違ったとき、外枠だけが
      逆の色で残る。
    -->
    <meta name="theme-color" content="#fafaf8" />

    <!--
      共有カード。ハッシュルーティング（/#/slides/<slug>）なのでフラグメントは
      サーバーに届かず、スクレイパが読むのはこの 1 枚だけ。だから OG はサイト全体で
      1 組しか持てない。デッキごとのカードを出すには、デッキごとの静的 HTML を焼いて
      ハッシュをやめる（Pages では 404.html の SPA フォールバック）必要がある。

      __ で囲んだ値はすべて vite.config.ts が入れる。
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:title" content="__TITLE__" />
    <meta property="og:description" content="__DESCRIPTION__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:alt" content="__IMAGE_ALT__" />
    <!-- 出すのは正方形のプロフィール画像なので summary。1200×630 のカードを
         用意したら summary_large_image に変える -->
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // 初期描画前にテーマを確定させ、ライト→ダークのちらつきを防ぐ
      (function () {
        try {
          var saved = localStorage.getItem('__THEME_KEY__');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
